[package]
name = "omnia-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "omnia"
path = "src/main.rs"

[features]
default = ["ndarray"]
ndarray = ["omnia-model/ndarray", "omnia-training/ndarray", "burn/ndarray"]
flex = ["omnia-model/flex", "burn/flex"]
simd = ["omnia-model/simd"]
openblas = ["omnia-model/openblas"]
cuda = ["omnia-model/cuda", "omnia-training/cuda", "burn/cuda"]
wgpu = ["omnia-model/wgpu", "omnia-training/wgpu", "burn/wgpu"]

[dependencies]
omnia-dsl = { path = "../omnia-dsl" }
omnia-engine = { path = "../omnia-engine" }
omnia-observation = { path = "../omnia-observation" }
omnia-search = { path = "../omnia-search" }
omnia-gen = { path = "../omnia-gen" }
omnia-model = { path = "../omnia-model", default-features = false }
omnia-training = { path = "../omnia-training", default-features = false }
omnia-eval = { path = "../omnia-eval" }
burn = { version = "0.21", default-features = false, features = ["std", "autodiff"] }
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
clap.workspace = true
anyhow.workspace = true
