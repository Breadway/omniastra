[workspace]
resolver = "2"
members = ["crates/omnia-dsl", "crates/omnia-engine", "crates/omnia-observation", "crates/omnia-search", "crates/omnia-gen", "crates/omnia-model", "crates/omnia-training", "crates/omnia-eval", "crates/omnia-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
blake3 = "1"
smallvec = { version = "1", features = ["serde", "union"] }
thiserror = "2"
anyhow = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
debug = 1
lto = "thin"

[profile.dev]
opt-level = 1
